name: Build Stasis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC and build
        shell: cmd
        run: |
          REM locate the latest VS installation that has the VC tools
          set "VSW=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSW%" (
            echo vswhere not found at "%VSW%"; listing Program Files directories
            dir "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer" || echo no installer dir
            exit /b 1
          )

          for /f "delims=" %%I in ('"%VSW%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VSINSTALL=%%I"

          if "%VSINSTALL%"=="" (
            echo No Visual Studio with VC tools found
            "%VSW%" -products * -format json
            exit /b 1
          )

          echo Found Visual Studio at "%VSINSTALL%"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64

          REM diagnostics - confirm cl is on PATH
          where cl || echo cl not found on PATH
          cl /? >nul 2>&1 || echo cl failed to run (check vcvarsall)

          REM run your build
          build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stasis.exe
          path: Stasis.exe
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Stasis.exe
          generate_release_notes: true