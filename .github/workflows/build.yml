name: Build Stasis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  BUILD_VERSION: ${{ github.run_number }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from git
        id: version
        run: |
          if ("${{ github.ref }}" -match "refs/tags/v(.+)") {
            $version = $matches[1]
          } else {
            $commit = (git rev-parse --short HEAD)
            $version = "dev-$commit"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC and build
        shell: cmd
        run: |
          REM locate the latest VS installation that has the VC tools
          set "VSW=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSW%" (
            echo vswhere not found at "%VSW%"; listing Program Files directories
            dir "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer" || echo no installer dir
            exit /b 1
          )

          for /f "delims=" %%I in ('"%VSW%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath') do set "VSINSTALL=%%I"

          if "%VSINSTALL%"=="" (
            echo No Visual Studio with VC tools found
            "%VSW%" -products * -format json
            exit /b 1
          )

          echo Found Visual Studio at "%VSINSTALL%"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64

          REM diagnostics - confirm cl is on PATH
          where cl || echo cl not found on PATH
          cl /? >nul 2>&1 || echo cl failed to run (check vcvarsall)

          REM run your build with version from git
          build.bat %VERSION%

      - name: Static analysis (MSVC /analyze)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64
          cl /analyze /W4 /c *.c 2>&1 | findstr /V /C:"note" /C:"warning" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stasis-${{ steps.version.outputs.VERSION }}-x64
          path: Stasis.exe
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Stasis.exe
          generate_release_notes: true
          name: Stasis v${{ steps.version.outputs.VERSION }}
          body: |
            ## Stasis v${{ steps.version.outputs.VERSION }}

            ### Changes
            ${{ github.event.release.body || 'See commit history for changes.' }}

            ### Download
            - [Stasis.exe](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Stasis.exe)

            ### Build Info
            - Commit: ${{ github.sha }}
            - Built on: ${{ github.run_id }}
            - Platform: Windows x64

      - name: Create prerelease artifact (on push to main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mkdir -p prerelease
          copy Stasis.exe prerelease\Stasis-${{ steps.version.outputs.VERSION }}-x64.exe
          echo "Built Stasis-${{ steps.version.outputs.VERSION }}-x64.exe" > prerelease\build-info.txt
          echo "Commit: ${{ github.sha }}" >> prerelease\build-info.txt
          echo "Date: $(date)" >> prerelease\build-info.txt

      - name: Upload prerelease artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Stasis-prerelease-${{ steps.version.outputs.VERSION }}
          path: prerelease/
          retention-days: 7